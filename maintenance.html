<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site en maintenance — AITO · Amicale des Ivoiriens de Toulouse et de l'Occitanie</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#0F1117;color:#e6edf3;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;}
    .flag{width:100%;height:6px;background:linear-gradient(to right,#E8650A 33.3%,#FFFFFF 33.3% 66.6%,#1A7A3C 66.6%);position:fixed;top:0;left:0;}
    .card{background:#1A1810;border:1px solid rgba(232,101,10,.25);border-radius:24px;padding:3rem 2.5rem;max-width:580px;width:100%;}
    .logo{margin-bottom:1.5rem;}
    .logo img{height:72px;border-radius:10px;filter:drop-shadow(0 2px 8px rgba(232,101,10,.4));}
    .icon{font-size:3.5rem;margin-bottom:1rem;}
    .badge{display:inline-block;background:rgba(232,101,10,.15);color:#F4874A;border:1px solid rgba(232,101,10,.35);border-radius:50px;padding:.4rem 1.2rem;font-size:.85rem;font-weight:700;margin-bottom:1.5rem;letter-spacing:.5px;}
    h1{font-size:1.9rem;font-weight:800;color:#fff;margin-bottom:.75rem;line-height:1.2;}
    p{color:#8A8070;line-height:1.75;margin-bottom:1.5rem;font-size:.97rem;}
    .progress{background:#2A2418;border-radius:50px;height:5px;margin:1.25rem 0 2rem;overflow:hidden;}
    .progress-bar{height:100%;background:linear-gradient(90deg,#1A7A3C,#E8650A,#F2C45A);border-radius:50px;animation:load 2.5s ease-in-out infinite alternate;width:70%;}
    @keyframes load{from{width:55%}to{width:88%}}
    .contact{background:#0D0E0A;border-radius:14px;padding:1.25rem 1.5rem;border:1px solid rgba(255,255,255,.06);}
    .contact p{margin:0;font-size:.9rem;color:#5A5040;}
    .contact a{color:#E8650A;font-weight:600;text-decoration:none;}
    .contact a:hover{text-decoration:underline;}
    .admin-btn{position:fixed;bottom:1.5rem;right:1.5rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;font-size:14px;transition:all .2s;}
    .admin-btn:hover{background:rgba(232,101,10,.2);border-color:rgba(232,101,10,.4);}
    .flag-colors{display:flex;justify-content:center;gap:8px;margin-bottom:1.5rem;}
    .fc{width:12px;height:12px;border-radius:50%;}
  </style>
</head>
<body>
<div class="flag"></div>
<div class="card">
  <div class="logo"><img src="images/logo.png" alt="AITO"></div>
  <div class="flag-colors">
    <div class="fc" style="background:#E8650A"></div>
    <div class="fc" style="background:#fff"></div>
    <div class="fc" style="background:#1A7A3C"></div>
  </div>
  <div class="badge">🔧 Maintenance en cours</div>
  <h1>Site en cours<br>de mise à jour</h1>
  <p>Nous préparons quelque chose de beau pour vous.<br>L'<strong style="color:#fff">AITO</strong> sera de retour très prochainement.</p>
  <div class="progress"><div class="progress-bar"></div></div>
  <div class="contact">
    <p>Pour nous contacter en attendant :<br>
    <a href="mailto:contact@aito-herault.fr">contact@aito-herault.fr</a></p>
  </div>
</div>
<a href="connexion.html" class="admin-btn" title="Connexion membre" onclick="window.location.href='connexion.html';return false;">⚙️</a>
</body>
</html>
