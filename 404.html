<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — AITO</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: system-ui, sans-serif; }
    .error-box { text-align: center; max-width: 480px; padding: 3rem 2rem; }
    .error-code { font-size: 6rem; font-weight: 900; color: var(--primary, #00703C); line-height: 1; margin-bottom: 1rem; }
    .error-box h1 { font-size: 1.5rem; color: #1a1a1a; margin-bottom: .75rem; }
    .error-box p { color: #6b7280; line-height: 1.7; margin-bottom: 2rem; }
    .error-box a { display: inline-block; background: var(--primary, #00703C); color: #fff; padding: .75rem 2rem; border-radius: 8px; text-decoration: none; font-weight: 600; transition: opacity .2s; }
    .error-box a:hover { opacity: .85; }
    .logo-wrap { margin-bottom: 2rem; }
    .logo-wrap img { height: 56px; width: auto; }
  </style>
</head>
<body>
  <div class="error-box">
    <div class="logo-wrap">
      <img src="images/logo.png" alt="AITO">
    </div>
    <div class="error-code">404</div>
    <h1>Page introuvable</h1>
    <p>La page que vous cherchez n'existe pas ou a été déplacée.<br>Retournez à l'accueil pour continuer votre visite.</p>
    <a href="index.html">&#8592; Retour à l'accueil</a>
  </div>
</body>
</html>
